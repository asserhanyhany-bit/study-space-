<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="114" fill="#34785f"/>
  <!-- Inner glow -->
  <rect width="512" height="512" rx="114" fill="url(#grad)" opacity="0.4"/>
  <!-- Checkmark -->
  <polyline points="128,272 216,360 384,160"
    fill="none" stroke="white" stroke-width="58"
    stroke-linecap="round" stroke-linejoin="round"/>
  <defs>
    <radialGradient id="grad" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
