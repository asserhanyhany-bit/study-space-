name: 🚀 Build Studyspace APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Capacitor dependencies
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: ⚙️ Create capacitor.config.json
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.studyspace.app",
            "appName": "Studyspace",
            "webDir": "www",
            "android": {
              "allowMixedContent": true,
              "backgroundColor": "#f4f6f3"
            }
          }
          EOF

      - name: 📂 Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp manifest.json www/manifest.json || true
          cp sw.js www/sw.js || true
          cp icon.svg www/icon.svg || true
          cp -r icons www/icons || true

      - name: 🤖 Add Android platform
        run: npx cap add android

      - name: 🔄 Sync Capacitor
        run: npx cap sync android

      - name: 🛠️ Fix duplicate Kotlin classes
        run: |
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> android/app/build.gradle

      - name: 🔐 Make Gradle executable
        run: chmod +x android/gradlew

      - name: 🔨 Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: studyspace-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
